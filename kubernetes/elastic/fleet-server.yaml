apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-server
  namespace: elastic

---
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: fleet-server
  namespace: elastic

spec:
  version: 9.5.5

  kibanaRef:
    name: petclinic-kibana

  elasticsearchRefs:
    - name: petclinic-logs

  mode: fleet
  fleetServerEnabled: true
  policyID: eck-fleet-server

  deployment:
    replicas: 1

    podTemplate:
      spec:
        serviceAccountName: fleet-server
        automountServiceAccountToken: true

        nodeSelector:
          role: observability

        tolerations:
          - key: workload
            operator: Equal
            value: observability
            effect: NoSchedule

        securityContext:
          runAsUser: 0

        containers:
          - name: agent
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi