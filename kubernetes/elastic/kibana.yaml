apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana

metadata:
  name: petclinic-kibana
  namespace: elastic

spec:
  version: 9.5.5
  count: 1

  elasticsearchRef:
    name: petclinic-logs

  podTemplate:
    spec:
      nodeSelector:
        role: observability

      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule

      containers:
        - name: kibana
          # Kibana derives its V8 heap from the container limit. At a 1Gi
          # limit the heap landed near 700MB, which the Observability
          # onboarding pages exhaust -- Kibana died with a JavaScript heap
          # OOM and the UI reported "Unable to load content". Set the heap
          # explicitly so it does not depend on auto-detection.
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1800"
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
