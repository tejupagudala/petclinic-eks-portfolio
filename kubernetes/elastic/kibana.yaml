apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana

metadata:
  name: petclinic-kibana
  namespace: elastic

spec:
  version: 9.5.5
  count: 1

  elasticsearchRef:
    name: petclinic-logs

  config:


    xpack.fleet.agents.fleet_server.hosts:
      - "https://fleet-server-agent-http.elastic.svc:8220"

    xpack.fleet.packages:
      - name: system
        version: latest
      - name: elastic_agent
        version: latest
      - name: fleet_server
        version: latest
      - name: synthetics
        version: latest

    xpack.fleet.outputs:
    - id: fleet-default-output
      name: default
      type: elasticsearch
      is_default: true
      is_default_monitoring: true
      hosts:
        - "https://petclinic-logs-es-http.elastic.svc:9200"
      ssl:
        certificate_authorities:
          - "/mnt/elastic-internal/elasticsearch-association/elastic/petclinic-logs/certs/ca.crt"

    xpack.fleet.agentPolicies:
      - name: Fleet Server on ECK policy
        id: eck-fleet-server
        namespace: default
        is_managed: true
        monitoring_enabled:
          - logs
          - metrics
        unenroll_timeout: 900
        package_policies:
          - name: fleet_server-1
            id: fleet_server-1
            package:
              name: fleet_server

      # Agent policy behind the Synthetics private location. A fixed id means
      # Kibana recreates the same policy on every start (fresh cluster or an
      # Elasticsearch reset), and synthetics-agent.yaml can reference it by
      # name instead of a UUID generated by a UI click. Not is_managed:
      # Synthetics adds a package policy here for each monitor it schedules.
      # The private location itself is in terraform/observability.
      - name: Synthetics private location
        id: synthetics-private-location
        namespace: default
        is_managed: false
        monitoring_enabled:
          - logs
          - metrics
        unenroll_timeout: 900
  podTemplate:
    spec:
      nodeSelector:
        role: observability

      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule

      containers:
        - name: kibana
          # Kibana derives its V8 heap from the container limit. At a 1Gi
          # limit the heap landed near 700MB, which the Observability
          # onboarding pages exhaust -- Kibana died with a JavaScript heap
          # OOM and the UI reported "Unable to load content". Set the heap
          # explicitly so it does not depend on auto-detection.
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1800"
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
