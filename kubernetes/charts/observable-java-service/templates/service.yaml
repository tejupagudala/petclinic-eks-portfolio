apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.serviceName }}
  namespace: {{ .Values.namespace }}

  labels:
    app.kubernetes.io/name: {{ .Values.serviceName }}

spec:
  selector:
    app.kubernetes.io/name: {{ .Values.serviceName }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

  type: ClusterIP
