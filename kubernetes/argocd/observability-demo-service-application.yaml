apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: observability-demo-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/tejupagudala/petclinic-eks-portfolio.git
    targetRevision: main

    # Our reusable golden Helm chart
    path: kubernetes/charts/observable-java-service

    helm:
      releaseName: observability-demo-service

      # Relative to the Helm chart directory
      valueFiles:
        - ../../observability-demo-service/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic

  syncPolicy:
    automated:
      prune: true
      selfHeal: true