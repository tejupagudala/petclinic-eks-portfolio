apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: petclinic-http
  namespace: petclinic
spec:
  entryPoints:
    - web

  routes:
    - match: Host(`petclinic.thedevopsportfolio.online`)
      kind: Rule

      middlewares:
        - name: https-redirect

      services:
        - name: api-gateway-stable
          port: 8080