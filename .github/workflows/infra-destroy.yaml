name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to continue"
        required: true
        type: string

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: github.event.inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest
    env:
      TF_VAR_github_org: ${{ vars.REPO_ORG }}
      TF_VAR_github_repo: ${{ vars.REPO_NAME }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_cluster_version: ${{ vars.EKS_ALLOWED_VERSION }}
      TF_VAR_enable_cost_anomaly_detection: "false"
      TF_VAR_existing_anomaly_monitor_arn: ""
      CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_INFRA }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Reap Kubernetes-created AWS resources before destroy
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -uo pipefail
          CLUSTER="${CLUSTER_NAME:-demo-eks-cluster}"

          # Load balancers (ALB/NLB) and their security groups are created by the
          # AWS Load Balancer Controller from Ingress/Service objects, so they are
          # invisible to Terraform. If the cluster is deleted first, nothing can
          # reap them and `terraform destroy` fails on DependencyViolation for the
          # subnets, IGW and VPC. Delete the Kubernetes objects while the
          # controller is still alive, then wait for AWS to catch up.
          if ! aws eks describe-cluster --name "$CLUSTER" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Cluster $CLUSTER not found; nothing to reap."
            exit 0
          fi
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

          # This job runs on a GitHub-hosted runner, and the cluster's public
          # endpoint only admits the CIDRs in eks_public_access_cidrs. Without
          # this, every kubectl call below times out and nothing gets reaped.
          # Allow-list this runner's IP for the few minutes the cluster has left.
          if ! kubectl get --raw=/version --request-timeout=15s >/dev/null 2>&1; then
            RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com)
            CURRENT=$(aws eks describe-cluster --name "$CLUSTER" --region "$AWS_REGION" \
              --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text | tr '\t' ',')
            echo "Runner ${RUNNER_IP} cannot reach the API server; adding it to publicAccessCidrs (${CURRENT})."
            aws eks update-cluster-config --name "$CLUSTER" --region "$AWS_REGION" \
              --resources-vpc-config "endpointPublicAccess=true,publicAccessCidrs=${CURRENT},${RUNNER_IP}/32" >/dev/null
            aws eks wait cluster-active --name "$CLUSTER" --region "$AWS_REGION"
            for i in $(seq 1 20); do
              kubectl get --raw=/version --request-timeout=15s >/dev/null 2>&1 && break
              sleep 15
            done
          fi
          if ! kubectl get --raw=/version --request-timeout=15s >/dev/null 2>&1; then
            echo "::warning::API server still unreachable; skipping in-cluster cleanup."
          fi

          # Argo CD self-heals deleted ingresses back into existence: remove the
          # Applications first or the ALB gets recreated under us.
          kubectl delete applications --all -n argocd --ignore-not-found --timeout=120s || true
          kubectl delete ingress --all -A --ignore-not-found --timeout=120s || true
          helm uninstall traefik -n traefik --timeout 3m 2>/dev/null || true
          # Any other Service of type LoadBalancer.
          kubectl get svc -A --field-selector spec.type=LoadBalancer \
            -o jsonpath='{range .items[*]}{.metadata.namespace} {.metadata.name}{"\n"}{end}' 2>/dev/null \
            | while read -r ns name; do [ -n "$ns" ] && kubectl delete svc -n "$ns" "$name" --ignore-not-found || true; done || true

          echo "Waiting for load balancers and k8s security groups to clear..."
          for i in $(seq 1 40); do
            LB=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" --query 'length(LoadBalancers)' --output text 2>/dev/null || echo 1)
            SG=$(aws ec2 describe-security-groups --region "$AWS_REGION" --filters "Name=group-name,Values=k8s-*" --query 'length(SecurityGroups)' --output text 2>/dev/null || echo 1)
            echo "  [$i] load balancers=$LB  k8s security groups=$SG"
            if [ "$LB" = "0" ] && [ "$SG" = "0" ]; then break; fi
            # Security groups linger after their LB is gone; remove them once free.
            if [ "$LB" = "0" ]; then
              for sg in $(aws ec2 describe-security-groups --region "$AWS_REGION" --filters "Name=group-name,Values=k8s-*" --query 'SecurityGroups[].GroupId' --output text 2>/dev/null); do
                aws ec2 delete-security-group --region "$AWS_REGION" --group-id "$sg" 2>/dev/null || true
              done
            fi
            sleep 15
          done
          echo "Pre-destroy cleanup finished (load balancers=$LB, k8s security groups=$SG)."

      - name: Destroy infrastructure
        run: |
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform destroy -auto-approve -input=false
      - name: Verify teardown
        run: |
          set -euo pipefail
          CLUSTER_NAME="${CLUSTER_NAME:-demo-eks-cluster}"
          EXIT=0

          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "${{ secrets.AWS_REGION }}" >/dev/null 2>&1; then
            echo "EKS cluster still exists: $CLUSTER_NAME"
            EXIT=1
          fi

          RUNNER_IDS=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values="${CLUSTER_NAME}-github-runner" Name=instance-state-name,Values=pending,running,stopping,stopped \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -n "$RUNNER_IDS" ]; then
            echo "Runner instances still exist: $RUNNER_IDS"
            EXIT=1
          fi

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters Name=tag:Name,Values="${CLUSTER_NAME}-vpc" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Vpcs[0].VpcId" --output text)
          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "VPC still exists: $VPC_ID"
            EXIT=1

            NATS=$(aws ec2 describe-nat-gateways \
              --filter Name=vpc-id,Values="$VPC_ID" Name=state,Values=available,pending,deleting \
              --region "${{ secrets.AWS_REGION }}" \
              --query "NatGateways[].NatGatewayId" --output text)
            if [ -n "$NATS" ]; then
              echo "NAT gateways still exist: $NATS"
              EXIT=1
            fi

            LBS=$(aws elbv2 describe-load-balancers \
              --region "${{ secrets.AWS_REGION }}" \
              --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" --output text)
            if [ -n "$LBS" ]; then
              echo "ALBs/NLBs still exist in VPC: $LBS"
              EXIT=1
            fi
          fi

          EIPS=$(aws ec2 describe-addresses \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Addresses[?Tags!=null && contains(join(',', Tags[].Value), '${CLUSTER_NAME}')].[AllocationId,PublicIp]" --output text)
          if [ -n "$EIPS" ]; then
            echo "Tagged EIPs still exist: $EIPS"
            EXIT=1
          fi

          VOLS=$(aws ec2 describe-volumes \
            --region "${{ secrets.AWS_REGION }}" \
            --filters Name=status,Values=available \
            --query "Volumes[?Tags!=null && contains(join(',', Tags[].Value), '${CLUSTER_NAME}')].[VolumeId,Size]" --output text)
          if [ -n "$VOLS" ]; then
            echo "Detached EBS volumes still exist: $VOLS"
            EXIT=1
          fi

          SNAPSHOTS=$(aws ec2 describe-snapshots \
            --owner-ids self \
            --region "${{ secrets.AWS_REGION }}" \
            --query "Snapshots[?Tags!=null && contains(join(',', Tags[].Value), '${CLUSTER_NAME}')].[SnapshotId,VolumeId]" --output text)
          if [ -n "$SNAPSHOTS" ]; then
            echo "EBS snapshots still exist: $SNAPSHOTS"
            EXIT=1
          fi

          if [ "$EXIT" -ne 0 ]; then
            echo "Teardown verification failed."
            exit 1
          fi
          echo "Teardown verified: no cluster, runner, VPC, NAT, or tagged EIPs."
