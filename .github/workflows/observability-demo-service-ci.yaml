name: observability-demo-service-ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/spring-petclinic-observability-demo-service/**"
      - "app/pom.xml"
      - "kubernetes/observability-demo-service/**"
      - "kubernetes/charts/observable-java-service/**"
      - "kubernetes/argocd/observability-demo-service-application.yaml"
      - ".github/workflows/observability-demo-service-ci.yaml"

permissions:
  contents: read

env:
  SERVICE_NAME: observability-demo-service
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/observability-demo-service

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build service
        run: |
          cd app

          ./mvnw \
            -pl spring-petclinic-observability-demo-service \
            -am \
            clean package \
            -DskipTests


  helm-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint kubernetes/charts/observable-java-service

      - name: Render demo service
        run: |
          helm template observability-demo-service \
            kubernetes/charts/observable-java-service \
            -f kubernetes/observability-demo-service/values.yaml


  docker-publish:
    needs:
      - build
      - helm-validate

    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/spring-petclinic-observability-demo-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.run_id }}


  update-gitops:
    needs:
      - docker-publish

    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Update image tag
        run: |
          FILE="kubernetes/observability-demo-service/values.yaml"

          sed -i \
            "s|^  tag:.*|  tag: \"${GITHUB_RUN_ID}\"|" \
            "$FILE"

          echo "Updated image:"
          grep -A3 "^image:" "$FILE"

      - name: Commit image promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/observability-demo-service/values.yaml

          git commit \
            -m "ci: promote observability-demo-service image ${GITHUB_RUN_ID}" \
            || echo "No changes to commit"

          git push origin HEAD:${{ github.head_ref }}