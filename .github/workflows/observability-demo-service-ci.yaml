name: observability-demo-service-ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/spring-petclinic-observability-demo-service/**"
      - "app/pom.xml"
      - "kubernetes/observability-demo-service/**"
      - "kubernetes/charts/observable-java-service/**"
      - ".github/workflows/observability-demo-service-ci.yaml"

permissions:
  contents: read

env:
  SERVICE_NAME: observability-demo-service
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/observability-demo-service

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build service
        run: |
          cd app
          ./mvnw \
            -pl spring-petclinic-observability-demo-service \
            -am \
            clean package \
            -DskipTests

  helm-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint kubernetes/charts/observable-java-service

      - name: Render demo service
        run: |
          helm template observability-demo-service \
            kubernetes/charts/observable-java-service \
            -f kubernetes/observability-demo-service/values.yaml